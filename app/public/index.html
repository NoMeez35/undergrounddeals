<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>undergrounddeals</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>undergrounddeals</h1>
      <p id="chargement" data-texte="chargement"></p>

      <section id="ecran-connexion" hidden>
        <p data-texte="connexion.accroche"></p>
        <p id="erreur-connexion" class="erreur" data-texte="connexion.erreur" hidden></p>
        <a class="bouton" href="/api/auth/steam" data-texte="connexion.bouton"></a>
      </section>

      <section id="ecran-accueil" hidden>
        <img id="avatar" alt="" width="96" height="96" hidden />
        <p><span data-texte="accueil.connecte"></span> <strong id="nom"></strong></p>
        <a class="bouton" href="/reglages" data-texte="accueil.reglages"></a>
        <button id="deconnexion" class="bouton secondaire" type="button" data-texte="deconnexion"></button>
      </section>

      <!-- Choix de la langue et du pays : à la première connexion, puis dans les Réglages. -->
      <section id="ecran-preferences" hidden>
        <h2 id="titre-preferences"></h2>
        <p id="explication-choix" data-texte="choix.explication" hidden></p>
        <form id="preferences">
          <label>
            <span data-texte="champ.langue"></span>
            <select id="langue" name="langue" required></select>
          </label>
          <label>
            <span data-texte="champ.pays"></span>
            <select id="pays" name="pays" required></select>
            <small data-texte="champ.paysAide"></small>
          </label>
          <button id="valider-preferences" class="bouton" type="submit"></button>
        </form>
        <p id="message-preferences" role="status" hidden></p>
        <a id="retour-reglages" class="bouton secondaire" href="/" data-texte="reglages.retour" hidden></a>
      </section>
    </main>
  </body>
</html>
