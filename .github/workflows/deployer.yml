name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deployer:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Préparer la base D1, le projet Pages et les secrets
        run: node scripts/preparer-cloudflare.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - name: Mettre à jour la base D1
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.jsonc
      - name: Déployer le Worker
        run: npx wrangler deploy --config worker/wrangler.jsonc --secrets-file worker/.secrets.json
      - name: Déployer l'appli
        working-directory: app
        run: npx wrangler pages deploy --project-name undergrounddeals --branch main --commit-hash ${{ github.sha }}
