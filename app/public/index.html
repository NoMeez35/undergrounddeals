<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>undergrounddeals</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>undergrounddeals</h1>
      <p id="chargement" data-texte="chargement"></p>

      <section id="ecran-connexion" hidden>
        <p data-texte="connexion.accroche"></p>
        <p id="erreur-connexion" class="erreur" data-texte="connexion.erreur" hidden></p>
        <a id="lien-connexion-steam" class="bouton" data-texte="connexion.bouton"></a>
      </section>

      <!-- Accueil : l'écran Mes suivis. -->
      <section id="ecran-accueil" hidden>
        <header class="profil">
          <img id="avatar" alt="" width="40" height="40" hidden />
          <p><span data-texte="accueil.connecte"></span> <strong id="nom"></strong></p>
          <a id="lien-alertes" class="bouton secondaire" data-texte="accueil.alertes"></a>
          <a id="lien-reglages" class="bouton secondaire" data-texte="accueil.reglages"></a>
          <button id="deconnexion" class="bouton secondaire" type="button" data-texte="deconnexion"></button>
        </header>

        <h2 data-texte="suivis.titre"></h2>
        <form id="formulaire-ajout">
          <label>
            <span data-texte="ajout.libelle"></span>
            <input id="lien" name="lien" required autocomplete="off" placeholder="Portal 2" />
            <small data-texte="ajout.aide"></small>
          </label>
          <button id="valider-ajout" class="bouton" type="submit" data-texte="ajout.bouton"></button>
        </form>
        <p id="message-ajout" role="status" hidden></p>
        <p id="message-recherche" role="status" hidden></p>
        <ul id="resultats-recherche" hidden></ul>

        <!-- Les produits de la liste de souhaits non suivis : sur un grand écran,
             dans une colonne à droite, toujours visible ; sur un petit écran,
             au-dessus des suivis. mes-suivis.js cache la colonne quand elle n'a
             rien à montrer, et sinon pose la classe `avec-souhaits`. -->
        <div id="colonnes" class="colonnes">
          <aside id="colonne-souhaits" class="colonne-souhaits" aria-labelledby="titre-non-suivis">
            <h3 id="titre-non-suivis" data-texte="souhaits.nonSuivis"></h3>
            <section id="souhaits-prives" class="encart" hidden>
              <p data-texte="souhaits.prives"></p>
              <a href="https://steamcommunity.com/my/edit/settings" target="_blank" rel="noopener" data-texte="souhaits.lienConfidentialite"></a>
              <button id="relire-souhaits" class="bouton secondaire" type="button" data-texte="souhaits.relire"></button>
              <p id="message-souhaits" role="status" hidden></p>
            </section>
            <ul id="liste-non-suivis"></ul>
          </aside>

          <div class="colonne-suivis">
            <div class="onglets" role="tablist">
              <button id="onglet-jeu" role="tab" type="button" data-type="jeu" aria-controls="liste-suivis">
                <span data-texte="suivis.onglet.jeu"></span> <span id="compte-jeu" class="compte"></span>
              </button>
              <button id="onglet-dlc" role="tab" type="button" data-type="dlc" aria-controls="liste-suivis">
                <span data-texte="suivis.onglet.dlc"></span> <span id="compte-dlc" class="compte"></span>
              </button>
            </div>
            <p id="erreur-suivis" class="erreur" role="alert" hidden></p>
            <p id="releve" class="note" hidden><span data-texte="suivis.releveLe"></span> <time id="heure-releve"></time></p>
            <ul id="liste-suivis" role="tabpanel"></ul>
            <p id="liste-vide" hidden></p>
          </div>
        </div>
      </section>

      <section id="ecran-alertes" hidden>
        <h2 data-texte="alertes.titre"></h2>
        <a id="retour-alertes" class="bouton secondaire" data-texte="alertes.retour"></a>
        <p id="erreur-alertes" class="erreur" role="alert" hidden></p>
        <ul id="liste-alertes"></ul>
        <p id="alertes-vide" data-texte="alertes.vide" hidden></p>
      </section>

      <!-- Choix de la langue et du pays : à la première connexion, puis dans les Réglages.
           Les adresses des liens sont posées par app.js, depuis chemins.js. -->
      <section id="ecran-reglages" hidden>
        <h2 id="titre-reglages"></h2>
        <p id="explication-choix" data-texte="choix.explication" hidden></p>
        <form id="formulaire-reglages">
          <label>
            <span data-texte="champ.langue"></span>
            <select id="langue" name="langue" required></select>
          </label>
          <label>
            <span data-texte="champ.pays"></span>
            <select id="pays" name="pays" required></select>
            <small data-texte="champ.paysAide"></small>
          </label>
          <button id="valider-reglages" class="bouton" type="submit"></button>
        </form>
        <p id="message-reglages" role="status" hidden></p>
        <a id="retour-reglages" class="bouton secondaire" data-texte="reglages.retour" hidden></a>
      </section>
    </main>
  </body>
</html>
